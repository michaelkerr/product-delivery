# Disabled for now — re-enable push/PR triggers when Actions minutes are available.
name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Sync and test
        run: |
          uv sync --extra dev || uv sync
          uv run pytest -q
